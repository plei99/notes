name: Patrick Lei
homepage: https://plei99.github.io/
repo: https://github.com/plei99/notes
title: Notes

# The same font pairings as the homepage (src/_data/site.yaml there); `id` is
# the data-latin value that styles.css and the homepage's fonts.css agree on.
latin_fonts:
  - group: Serif
    fonts:
      - { id: pagella, name: Pagella }
      - { id: euler, name: Pagella + Euler }
      - { id: bonum, name: Bonum }
      - { id: schola, name: Schola }
      - { id: latin-modern, name: Latin Modern }
      - { id: libertinus, name: Libertinus }
      - { id: garamond, name: Garamond }
      - { id: hundar, name: Hundar }
  - group: Sans
    sans: true
    fonts:
      - { id: fira, name: Fira Sans }
      - { id: new-cm-sans, name: New CM Sans }
      - { id: lato, name: Lato }

# Who each type of note credits, on its page. `credits` is used instead of
# `credit` when a note has more than one lecturer.
types:
  course: { credit: Lectures by }
  seminar: { credit: Talks by }
  workshop: { credit: Lectures by }
  lecture series: { credit: Lectures by }
  talk: { credit: Talk by, credits: Talks by }
  expository: { credit: By }

# The facets the index filters by, in the order they are shown. `under` files a
# value under another: its notes count as the broader one too, and choosing the
# broader one offers all of it, only those notes, or none of them.
facets:
  - { key: location, label: Where }
  - { key: type, label: What }
  - key: subjects
    label: Subject
    under: { enumerative geometry: algebraic geometry }

# Interface strings, in English and on the Chinese index (/zh/). The Chinese
# lede follows the homepage's.
strings:
  en:
    lang: en
    title: Notes
    lede: >-
      Notes I typed up from courses, seminars, summer schools and talks, mostly
      at Columbia, UMass, Boston College and the Simons Center. Each one is here
      as a web page and as the original PDF.
    skip: Skip to content
    theme: Theme
    latin_font: Font
    all_notes: All notes
    homepage: Homepage
    source: Source
    filter: Filter notes
    search: Search
    search_placeholder: Search titles, lecturers, descriptions
    any: any
    count_all: "{n} notes"
    count_some: "{shown} of {n} notes"
    show_all: Show all
    none: No notes match.
    show_all_notes: Show all notes
    all: all
    only: "{child} only"
    without: "no {child}"
    summary_only: "{child}"
    summary_without: "{value} without enumerative"
    pdf: PDF
    translation: "中文 ({translator})"
    switch: 中文
    how: How the notes were converted to HTML
    how_failed: The diagram could not be loaded.
    close: Close
  zh:
    lang: zh-CN
    title: 笔记
    lede: >-
      我在课程、讨论班、暑期学校和报告中整理的笔记，主要来自哥伦比亚大学、马萨诸塞大学、波士顿学院和
      Simons 中心。每份笔记都有网页版和原始 PDF。
    skip: 跳到正文
    theme: 主题
    latin_font: 西文字体
    cjk_font: 中文字体
    cjk_serif: 思源宋体
    cjk_sans: 思源黑体
    cjk_rounded: 自由圆体
    cjk_kai: 霞鹜文楷
    all_notes: 全部笔记
    homepage: 主页
    source: 源代码
    filter: 筛选笔记
    search: 搜索
    search_placeholder: 搜索标题、讲者、简介
    any: 不限
    count_all: "共 {n} 份笔记"
    count_some: "{shown} / {n} 份笔记"
    show_all: 显示全部
    none: 没有符合条件的笔记。
    show_all_notes: 显示全部笔记
    all: 全部
    only: "仅{child}"
    without: "不含{child}"
    summary_only: "{child}"
    summary_without: "{value}（不含计数几何）"
    pdf: PDF
    translation: "中文译本（{translator}）"
    switch: en
    how: 这些笔记如何转换为 HTML
    how_failed: 无法载入流程图。
