name: Patrick Lei
homepage: https://plei99.github.io/
repo: https://github.com/plei99/notes
title: Notes
lede: >-
  Notes I typed up from courses, seminars, summer schools and talks, mostly at
  Columbia, UMass, Boston College and the Simons Center. Each one is here as a
  web page and as the original PDF.

# The same font pairings as the homepage (src/_data/site.yaml there); `id` is
# the data-latin value that styles.css and the homepage's fonts.css agree on.
latin_fonts:
  - group: Serif
    fonts:
      - { id: pagella, name: Pagella }
      - { id: euler, name: Pagella + Euler }
      - { id: bonum, name: Bonum }
      - { id: schola, name: Schola }
      - { id: latin-modern, name: Latin Modern }
      - { id: libertinus, name: Libertinus }
      - { id: garamond, name: Garamond }
      - { id: hundar, name: Hundar }
  - group: Sans
    sans: true
    fonts:
      - { id: fira, name: Fira Sans }
      - { id: new-cm-sans, name: New CM Sans }
      - { id: lato, name: Lato }

# How each type of note introduces its subjects, and who it credits.
types:
  course: { phrase: Course on, credit: Lectures by }
  seminar: { phrase: Seminar on, credit: Talks by }
  workshop: { phrase: Workshop on, credit: Lectures by }
  lecture series: { phrase: Lecture series on, credit: Lectures by }
  talk: { phrase: Talk on, credit: Talk by }
  expository: { phrase: Notes on, credit: By }

# The facets the index filters by, in the order they are shown. `under` files a
# value under another: its notes count as the broader one too, and choosing the
# broader one offers all of it, only those notes, or none of them.
facets:
  - { key: location, label: Where }
  - { key: type, label: What }
  - key: subjects
    label: Subject
    under: { enumerative geometry: algebraic geometry }
